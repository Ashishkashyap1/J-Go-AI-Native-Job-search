[project]
name = "lnkd"
version = "0.1.0"
description = "LinkedIn all-rounder CLI (personal use)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "keyring>=25",
    "playwright>=1.44",   # only needed for `auth login`
]

[project.scripts]
lnkd = "lnkd.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
